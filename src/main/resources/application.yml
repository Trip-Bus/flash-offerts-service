spring:
  application:
    name: flash-offers-service

  # "qa" y "prod" activan además el perfil "desplegado" (exige secretos, sin valores por defecto).
  profiles:
    group:
      qa: desplegado
      prod: desplegado

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:18106}/${DB_NAME:tripbus_offers}
    username: ${DB_USERNAME:offers}
    password: ${DB_PASSWORD:offers_qa_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:18100}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:18001/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:18006}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: flash-offers-service
  info:
    env:
      enabled: true

# /actuator/info: commit con el que se construyó la imagen (build-arg GIT_COMMIT del Dockerfile).
info:
  app:
    commit: ${APP_COMMIT:local}

tripbus:
  internal-token: ${INTERNAL_API_TOKEN:tripbus_internal_qa_token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: flash-offers-service
  offers:
    seat-inventory-url: ${SEAT_INVENTORY_URL:http://localhost:18003}
    catalog-url: ${CATALOG_URL:http://localhost:18002}
  jobs:
    offer-scheduler-ms: 2000
    # US-058: reconciliación del contador de cupo de Redis con las ventas de la BD (QuotaReconciler).
    quota-reconcile-ms: ${QUOTA_RECONCILE_MS:60000}
