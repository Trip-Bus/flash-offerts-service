spring:
  application:
    name: flash-offers-service

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/tripbus_offers
    username: ${DB_USERNAME:tripbus}
    password: ${DB_PASSWORD:tripbus_local_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:16001/.well-known/jwks.json}

server:
  port: 16006
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: flash-offers-service

tripbus:
  internal-token: ${INTERNAL_API_TOKEN:tripbus-internal-dev-token}
  events:
    enabled: ${EVENTS_ENABLED:true}
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:true}
    stream: ${EVENTS_STREAM:tripbus:events}
    max-len: 100000
    group: flash-offers-service
  offers:
    seat-inventory-url: ${SEAT_INVENTORY_URL:http://localhost:16003}
    catalog-url: ${CATALOG_URL:http://localhost:16002}
  jobs:
    offer-scheduler-ms: 2000
