# Perfil de pruebas de integración (FlashOfferQuotaIT). PostgreSQL y Redis los levanta Testcontainers y
# @ServiceConnection inyecta su host/puerto: aquí solo va lo propio de las pruebas.
tripbus:
  events:
    # Stream aparte para no mezclar eventos de prueba con los de QA.
    stream: tripbus:events:test
    # Sin consumidor en segundo plano: las pruebas invocan los servicios directamente.
    consumer-enabled: false
